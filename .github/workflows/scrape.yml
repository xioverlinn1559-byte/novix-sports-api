name: Novix Sports Scraper

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        run: python scraper/scrape.py || echo "⚠️ Scraper soft-failed (CF block?), continuing..."
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit and push
        run: |
          git config user.name "Novix Sports Bot"
          git config user.email "bot@novix.app"
          git add api/
          git diff --cached --quiet || git commit -m "🔄 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

